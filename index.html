<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#19192a;--border:#1e1e33;--text:#e8e8f0;--muted:#6b6b8d;--accent:#3b82f6;--accent2:#818cf8;--green:#22c55e;--yellow:#eab308;--red:#ef4444;--purple:#a78bfa;--orange:#f59e0b;--pink:#ec4899;--radius:10px;--mono:'Geist Mono',ui-monospace,monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overflow-x:hidden}
#login{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}.lc{width:100%;max-width:360px;text-align:center}.ls{width:56px;height:56px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 20px;color:#fff}.lh{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-bottom:4px}.lsub{color:var(--muted);font-size:13px;margin-bottom:28px}.lw{position:relative;margin-bottom:14px}.lw i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px}.lw input{width:100%;padding:12px 14px 12px 38px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;font-family:var(--sans);outline:none}.lw input:focus{border-color:var(--accent)}.lbtn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-size:14px;font-weight:700;cursor:pointer}.lbtn:hover{background:#2563eb}.lerr{color:var(--red);font-size:12px;margin-top:12px;display:none}.lft{color:var(--muted);font-size:10px;margin-top:24px;opacity:.5}
#dash{display:none;padding:16px;max-width:1200px;margin:0 auto}.hdr{display:flex;align-items:center;gap:10px;margin-bottom:2px}.hdr h1{font-size:18px;font-weight:800}.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 2s ease infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}.hdr-sub{color:var(--muted);font-size:11px;margin-bottom:14px}
.refresh-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:11px;color:var(--muted)}.refresh-bar button{padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans)}.refresh-bar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pipe{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);font-size:10px;color:var(--muted);margin-bottom:14px;overflow-x:auto;white-space:nowrap}.pipe .arr{opacity:.3}.pipe .done{color:var(--green);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}.kpi-v{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;font-family:var(--mono)}.kpi-l{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:5px}.kpi-v.g{color:var(--green)}.kpi-v.y{color:var(--yellow)}.kpi-v.r{color:var(--red)}.kpi-v.b{color:var(--accent)}.kpi-v.o{color:var(--orange)}.kpi-v.p{color:var(--pink)}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.mini{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}.mini h3{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}.bar-r{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}.bar-lb{width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:11px;flex-shrink:0}.bar-tk{flex:1;height:20px;background:var(--bg3);border-radius:6px;overflow:hidden}.bar-fl{height:100%;border-radius:6px;transition:width .6s ease}.bar-n{width:26px;text-align:right;font-weight:700;font-size:11px;font-family:var(--mono);flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:0;overflow-x:auto}.tab{padding:10px 16px;font-size:12px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);transition:all .15s;white-space:nowrap;user-select:none}.tab:hover{color:var(--text)}.tab.on{color:var(--accent);border-color:var(--accent)}.tab .c{background:var(--bg3);border-radius:100px;padding:1px 7px;font-size:10px;margin-left:5px;font-family:var(--mono)}.tab.on .c{background:rgba(59,130,246,.15);color:var(--accent)}.pnl{display:none}.pnl.on{display:block}
.srch{display:flex;gap:8px;padding:12px 0;align-items:center;flex-wrap:wrap}.srch input{flex:1;min-width:160px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-family:var(--sans);outline:none}.srch input:focus{border-color:var(--accent)}.fbtn{padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:11px;cursor:pointer;background:var(--bg2);color:var(--muted);font-weight:600;font-family:var(--sans)}.fbtn:hover,.fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:700px}th{text-align:left;color:var(--muted);font-weight:500;padding:10px;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}td{padding:10px;border-bottom:1px solid rgba(30,30,51,.5);vertical-align:top}tr:hover td{background:rgba(59,130,246,.04)}
.bdg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600;white-space:nowrap}.b-e{background:rgba(34,197,94,.12);color:#4ade80}.b-p{background:rgba(234,179,8,.12);color:#fbbf24}.b-fb{background:rgba(24,119,242,.12);color:#60a5fa}.b-ig{background:rgba(193,53,132,.12);color:#f472b6}.b-apo{background:rgba(34,197,94,.1);color:#4ade80}.b-coord{background:rgba(167,139,250,.1);color:var(--purple)}.b-con{background:rgba(239,68,68,.1);color:#f87171}
.cm{max-width:280px;line-height:1.4}.cm-t{color:var(--text);font-size:12px}.cm-rl{font-size:9px;color:var(--muted);text-transform:uppercase;margin-top:6px;letter-spacing:.04em}.cm-resp{color:var(--green);font-size:11px;line-height:1.35;font-style:italic;margin-top:2px}.ts{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}.nm{font-weight:600;white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;display:block}
.lk{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:var(--radius);font-size:10px;font-weight:600;text-decoration:none;border:1px solid var(--border);color:var(--accent);background:transparent}.lk:hover{background:rgba(59,130,246,.1);border-color:var(--accent)}.lk.off{opacity:.25;pointer-events:none}
.empty{text-align:center;padding:40px;color:var(--muted)}.empty i{font-size:28px;display:block;margin-bottom:8px}
/* Review tab */
.rev-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;position:relative;transition:all .15s}.rev-card:hover{border-color:var(--muted)}.rev-card.sev-CRITICO{border-left:3px solid var(--red)}.rev-card.sev-ALTO{border-left:3px solid var(--orange)}
.rev-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:6px}.rev-user{display:flex;align-items:center;gap:8px}.rev-av{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}.rev-nm{font-size:13px;font-weight:600}.rev-meta{font-size:11px;color:var(--muted)}
.rev-text{font-size:13px;line-height:1.5;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;word-break:break-word;max-height:160px;overflow-y:auto;white-space:pre-wrap}.rev-text mark{background:#7f1d1d;color:var(--red);padding:1px 3px;border-radius:2px}
.rev-foot{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}.rev-kw{padding:2px 7px;border-radius:100px;font-size:10px;background:rgba(127,29,29,.2);color:var(--red);border:1px solid rgba(127,29,29,.3);display:inline-block;margin:0 2px}
.rev-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:var(--sans)}.rev-btn:hover{background:var(--bg3);color:var(--text)}.rev-btn.ok{border-color:#166534;color:var(--green)}.rev-btn.ok:hover{background:rgba(34,197,94,.08)}.rev-btn.flag{border-color:#7f1d1d;color:var(--red)}.rev-btn.flag:hover{background:rgba(239,68,68,.08)}
.rev-card.resolved{opacity:.35}.rev-card.ok-d::after{content:'✅ OK';position:absolute;top:8px;right:12px;font-size:11px;color:var(--green);font-weight:600}.rev-card.flag-d::after{content:'🗑️ Remover';position:absolute;top:8px;right:12px;font-size:11px;color:var(--red);font-weight:600}
.rev-row{font-size:10px;color:var(--muted);font-family:var(--mono)}
.sev-filters{display:flex;gap:6px;margin-bottom:12px}.sev-btn{padding:5px 12px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:var(--sans)}.sev-btn:hover{background:var(--bg3);color:var(--text)}.sev-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
/* Error alert box */
.err-alert{background:var(--bg2);border:1px solid #7f1d1d;border-radius:var(--radius);padding:16px;margin-bottom:16px}.err-alert h3{color:var(--red);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}.err-alert p{font-size:13px;color:var(--muted);line-height:1.5}.err-alert code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:12px;color:var(--red);font-family:var(--mono)}
.err-fix{margin-top:10px;list-style:none}.err-fix li{font-size:12px;color:var(--text);padding:6px 10px;background:var(--bg);border-radius:6px;border-left:2px solid var(--accent);margin-bottom:4px}.err-fix li strong{color:var(--accent)}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.minis{grid-template-columns:1fr}.tabs{font-size:11px}}
</style>
</head>
<body>
<div id="login"><div class="lc"><div class="ls"><i class="fa-solid fa-shield-halved"></i></div><div class="lh">QG Respostas</div><div class="lsub">Campanha Luciano 4090 · Acesso Restrito</div><form onsubmit="return doLogin(event)"><div class="lw"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="Senha de acesso" autofocus autocomplete="off"></div><button type="submit" class="lbtn">Entrar</button></form><div class="lerr" id="lerr"><i class="fa-solid fa-triangle-exclamation"></i> Senha incorreta</div><div class="lft">Protegido por criptografia SHA-256</div></div></div>
<div id="dash">
<div class="hdr"><h1>📡 QG Respostas</h1><div class="live-dot"></div></div>
<div class="hdr-sub">Dados ao vivo da planilha COMENTARIOS</div>
<div class="refresh-bar"><span id="last-update"><i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i>Carregando...</span><button onclick="loadData()"><i class="fa-solid fa-arrows-rotate" style="margin-right:4px"></i>Atualizar</button></div>
<div class="pipe"><span><i class="fa-solid fa-comments" style="color:var(--purple)"></i> Comentário</span><span class="arr">→</span><span><i class="fa-solid fa-brain" style="color:var(--accent2)"></i> Cérebro IA</span><span class="arr">→</span><span style="color:var(--yellow)"><i class="fa-solid fa-clock"></i> Fila</span><span class="arr">→</span><span><i class="fa-solid fa-paper-plane" style="color:var(--accent)"></i> Disparo</span><span class="arr">→</span><span class="done"><i class="fa-solid fa-circle-check"></i> Enviado</span></div>
<div class="kpis" id="kpis"></div>
<div class="minis" id="minis"></div>
<div class="tabs" id="tabs">
<div class="tab on" data-t="env"><i class="fa-solid fa-circle-check" style="color:var(--green);margin-right:4px"></i>Enviados<span class="c" id="ce">0</span></div>
<div class="tab" data-t="pend"><i class="fa-solid fa-clock" style="color:var(--yellow);margin-right:4px"></i>Na Fila<span class="c" id="cp">0</span></div>
<div class="tab" data-t="all"><i class="fa-solid fa-list" style="color:var(--purple);margin-right:4px"></i>Todos<span class="c" id="ca">0</span></div>
<div class="tab" data-t="review" style="color:var(--orange)"><i class="fa-solid fa-shield-halved" style="margin-right:4px"></i>🔍 Revisão<span class="c" id="cr">0</span></div>
<div class="tab" data-t="errors" style="color:var(--red)"><i class="fa-solid fa-bug" style="margin-right:4px"></i>Erros IG<span class="c" id="cerr">0</span></div>
</div>
<div class="pnl on" id="pe"></div>
<div class="pnl" id="pp"></div>
<div class="pnl" id="pa"></div>
<div class="pnl" id="preview"></div>
<div class="pnl" id="perrors"></div>
</div>
<script>
var H="15bb3c2a4c7dac500a6550ca934f95bab0d3271a17216080e9a53f3ca22cb618";
async function sha(m){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(m));return[...new Uint8Array(b)].map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function doLogin(e){e.preventDefault();if(await sha(document.getElementById("pw").value)===H){sessionStorage.setItem("qg","1");document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block";loadData()}else{document.getElementById("lerr").style.display="block";document.getElementById("pw").value="";document.getElementById("pw").focus()}return false}
if(sessionStorage.getItem("qg")==="1"){document.getElementById("login").style.display="none";document.getElementById("dash").style.display="block";setTimeout(loadData,100)}

var GVIZ_BASE="https://docs.google.com/spreadsheets/d/1XqxOih0RSSMWXA7X3DPYOt3_xk0jK9yjlLpq0-qsyME/gviz/tq?tqx=out:json&sheet=COMENTARIOS";
var NEG_KW=["burro","b&rro","safado","vergonha","triste","mentir","ridícul","ignorant","gado","não sabe","não conhece","boi","lixo","nojo","imbecil","idiota","corrupto","ladrão","bandido","piada","palhaç","incompetent","fracass","inútil","covarde","fake","tosco","patétic","absurd","🐂","🤡","porcaria","merda","bosta"];
var envData=[],pendData=[],allRaw=[],reviewData=[],errorData=[],revDecisions={},revFilter="all";

async function gvizFetch(tq){
  var url=GVIZ_BASE+"&tq="+encodeURIComponent(tq)+"&_="+Date.now();
  var resp=await fetch(url);var text=await resp.text();
  var json=JSON.parse(text.replace(/^[^(]*\(/,"").replace(/\);?\s*$/,""));
  return json.table.rows;
}

async function loadData(){
  document.getElementById("last-update").innerHTML='<i class="fa-solid fa-spinner fa-spin" style="margin-right:4px"></i>Atualizando...';
  try{
    var mainRows=await gvizFetch("SELECT A,B,C,D,E,F,G,J,K,Q,R,S,T,U,V WHERE U LIKE 'ENVIADO%' OR U='PENDENTE_ENVIO'");
    envData=[];pendData=[];
    for(var i=0;i<mainRows.length;i++){var c=mainRows[i].c;var g=function(idx){return c[idx]?((c[idx].v!==null&&c[idx].v!==undefined)?String(c[idx].v):""):""};
      var st=g(13),cid=g(8),pid=g(7),pl=g(4).toUpperCase(),pk=g(14),lk="";
      if(pk)lk=pk;else if(cid&&pl.indexOf("FACEBOOK")>=0)lk="https://www.facebook.com/"+cid;
      var e={dh:g(0).substring(0,16),nm:g(1)||"Desconhecido",un:g(2),cm:g(3),pl:g(4),cl:g(5),rl:g(6),pid:pid,cid:cid,pt:g(9).substring(0,80),ar:g(10),rsp:g(11),tg:g(12),st:st,lk:lk,ee:st.indexOf("ENVIADO")===0?st.replace("ENVIADO_","").substring(0,19).replace("T"," "):""};
      if(st.indexOf("ENVIADO")===0)envData.push(e);else pendData.push(e);
    }
    envData.sort(function(a,b){return b.ee.localeCompare(a.ee)});
    renderMain(envData,pendData);
    var now=new Date();
    document.getElementById("last-update").innerHTML='<i class="fa-solid fa-check-circle" style="color:var(--green);margin-right:4px"></i>Atualizado '+now.toLocaleTimeString("pt-BR")+" · "+mainRows.length+" registros";
  }catch(err){document.getElementById("last-update").textContent="Erro: "+err.message}
  try{await loadAllData()}catch(e){console.error("Review load error:",e)}
}

async function loadAllData(){
  var allRows=await gvizFetch("SELECT A,B,C,D,E,F,G,H,I,J,K,U");
  allRaw=[];reviewData=[];errorData=[];
  var seen={};
  for(var i=0;i<allRows.length;i++){var c=allRows[i].c;var g=function(idx){return c[idx]?((c[idx].v!==null&&c[idx].v!==undefined)?String(c[idx].v):""):""};
    var item={row:i+2,dh:g(0),nm:g(1)||"Desconhecido",un:g(2),cm:g(3),pl:g(4),cl:g(5),rl:g(6),proc:g(7),acao:g(8),pid:g(9),cid:g(10),st:g(11)};
    allRaw.push(item);
    var cmLow=(item.cm||"").toLowerCase(),matched=[];
    NEG_KW.forEach(function(kw){if(cmLow.indexOf(kw.toLowerCase())>=0)matched.push(kw)});
    var wasPrc=item.acao==="CURTIDO"||item.st.indexOf("ENVIADO")===0||item.st==="PENDENTE_ENVIO";
    if(matched.length>0&&wasPrc){var key=item.cm.substring(0,80);if(!seen[key]){seen[key]=1;var sev=matched.length>=2||item.cl==="CONTRA"?"CRITICO":"ALTO";reviewData.push(Object.assign({},item,{negKw:matched,severity:sev}))}}
    if(item.acao&&item.acao.indexOf("ERRO")===0)errorData.push(item);
  }
  document.getElementById("cr").textContent=reviewData.length;
  document.getElementById("cerr").textContent=errorData.length;
  renderReview();renderErrors();
}

function renderMain(env,pend){
  var all=env.concat(pend),nE=env.length,nP=pend.length;
  document.getElementById("kpis").innerHTML='<div class="kpi"><div class="kpi-v g">'+nE+'</div><div class="kpi-l">Enviados</div></div><div class="kpi"><div class="kpi-v y">'+nP+'</div><div class="kpi-l">Na Fila</div></div><div class="kpi"><div class="kpi-v r">'+errorData.length+'</div><div class="kpi-l">Erros IG</div></div><div class="kpi"><div class="kpi-v o">'+reviewData.length+'</div><div class="kpi-l">P/ Revisão</div></div><div class="kpi"><div class="kpi-v b">'+(nE+nP)+'</div><div class="kpi-l">Total IA</div></div>';
  document.getElementById("ce").textContent=nE;document.getElementById("cp").textContent=nP;document.getElementById("ca").textContent=nE+nP;
  var cl={},plt={};all.forEach(function(e){cl[e.cl]=(cl[e.cl]||0)+1;var p=e.pl.toUpperCase().indexOf("INSTAGRAM")>=0?"Instagram":"Facebook";plt[p]=(plt[p]||0)+1});
  var mxC=Math.max.apply(null,Object.values(cl).concat([1])),mxP=Math.max.apply(null,Object.values(plt).concat([1]));
  var cc={"APOIADOR":"var(--green)","COORDENADOR_POTENCIAL":"var(--purple)","VOTO_DECLARADO":"var(--accent)","POTENCIAL":"var(--yellow)","CONTRA":"var(--red)","NEUTRO":"var(--muted)"};
  var pc={"Facebook":"#3b82f6","Instagram":"#ec4899"};var cb="",pb="";
  Object.entries(cl).sort(function(a,b){return b[1]-a[1]}).forEach(function(kv){cb+='<div class="bar-r"><span class="bar-lb">'+kv[0]+'</span><div class="bar-tk"><div class="bar-fl" style="width:'+kv[1]/mxC*100+'%;background:'+(cc[kv[0]]||"var(--muted)")+'"></div></div><span class="bar-n">'+kv[1]+'</span></div>'});
  Object.entries(plt).sort(function(a,b){return b[1]-a[1]}).forEach(function(kv){pb+='<div class="bar-r"><span class="bar-lb">'+kv[0]+'</span><div class="bar-tk"><div class="bar-fl" style="width:'+kv[1]/mxP*100+'%;background:'+(pc[kv[0]]||"var(--muted)")+'"></div></div><span class="bar-n">'+kv[1]+'</span></div>'});
  document.getElementById("minis").innerHTML='<div class="mini"><h3><i class="fa-solid fa-tags" style="margin-right:4px"></i>Classificacao</h3>'+cb+'</div><div class="mini"><h3><i class="fa-solid fa-share-nodes" style="margin-right:4px"></i>Plataforma</h3>'+pb+'</div>';
  document.getElementById("pe").innerHTML=bT(env,false);document.getElementById("pp").innerHTML=bT(pend,false);document.getElementById("pa").innerHTML=bT(all,true);
}
function bg(c){var m={"APOIADOR":"b-apo","COORDENADOR_POTENCIAL":"b-coord","VOTO_DECLARADO":"b-apo","POTENCIAL":"b-p","CONTRA":"b-con"};return'<span class="bdg '+(m[c]||"")+'">'+(c||"\u2014")+'</span>'}
function pB(p){var ig=(p||"").toUpperCase().indexOf("INSTAGRAM")>=0;return'<span class="bdg '+(ig?"b-ig":"b-fb")+'"><i class="fa-brands fa-'+(ig?"instagram":"facebook")+'" style="margin-right:3px"></i>'+(ig?"IG":"FB")+'</span>'}
function tr(s,n){return(s||"").length>n?(s||"").substring(0,n)+"\u2026":(s||"\u2014")}
function bT(items,ss){if(!items.length)return'<div class="empty"><i class="fa-solid fa-inbox"></i>Nenhum item</div>';var h='<div class="srch"><input type="text" placeholder="Buscar..." oninput="flt(this)"><button class="fbtn" onclick="pf(this,\'FB\')"><i class="fa-brands fa-facebook"></i> FB</button><button class="fbtn" onclick="pf(this,\'IG\')"><i class="fa-brands fa-instagram"></i> IG</button></div><div class="tw"><table><thead><tr><th>Data</th><th>Plat</th><th>Autor</th><th>Classif</th><th>Comentario / Resposta</th>';if(ss)h+='<th>Status</th>';h+='<th>Rastrear</th></tr></thead><tbody>';items.forEach(function(e){var st=e.st.indexOf("ENVIADO")===0?'<span class="bdg b-e"><i class="fa-solid fa-check" style="margin-right:2px"></i>OK</span><br><span class="ts">'+e.ee+'</span>':'<span class="bdg b-p"><i class="fa-solid fa-clock" style="margin-right:2px"></i>Fila</span>';h+='<tr data-s="'+(e.nm+" "+e.cm+" "+e.rsp+" "+e.cl+" "+e.pl).toLowerCase()+'" data-p="'+((e.pl||"").toUpperCase().indexOf("INSTAGRAM")>=0?"IG":"FB")+'">';h+='<td class="ts">'+tr(e.dh,16)+'</td><td>'+pB(e.pl)+'</td><td><span class="nm" title="'+e.nm+'">'+tr(e.nm,14)+'</span></td><td>'+bg(e.cl)+'</td><td class="cm"><div class="cm-t">'+tr(e.cm,100)+'</div>'+(e.rsp?'<div class="cm-rl"><i class="fa-solid fa-robot" style="margin-right:2px"></i>IA</div><div class="cm-resp">'+tr(e.rsp,150)+'</div>':'')+'</td>';if(ss)h+='<td>'+st+'</td>';h+='<td>'+(e.lk?'<a href="'+e.lk+'" target="_blank" rel="noopener" class="lk"><i class="fa-solid fa-arrow-up-right-from-square"></i>Ver</a>':'<span class="lk off">\u2014</span>')+'</td></tr>'});h+='</tbody></table></div>';return h}

function renderReview(){
  var p=document.getElementById("preview");
  if(!reviewData.length){p.innerHTML='<div class="empty"><i class="fa-solid fa-circle-check"></i><p>Nenhum comentário suspeito!</p></div>';return}
  var critico=reviewData.filter(function(d){return d.severity==="CRITICO"&&!revDecisions[d.row]}).length;
  var alto=reviewData.filter(function(d){return d.severity==="ALTO"&&!revDecisions[d.row]}).length;
  var resolved=Object.keys(revDecisions).length;
  var html='<div class="err-alert" style="border-color:var(--orange)"><h3 style="color:var(--orange)"><i class="fa-solid fa-shield-halved"></i> Revisão Humana Necessária</h3><p>Estes comentários foram <strong>curtidos ou respondidos pela automação</strong> (ManyChat/n8n), mas contêm sinais de negatividade, sarcasmo ou hostilidade. Verifique e decida: manter ou remover a resposta/curtida.</p></div>';
  html+='<div class="kpis" style="margin-bottom:12px"><div class="kpi"><div class="kpi-v r">'+critico+'</div><div class="kpi-l">Críticos</div></div><div class="kpi"><div class="kpi-v o">'+alto+'</div><div class="kpi-l">Altos</div></div><div class="kpi"><div class="kpi-v g">'+resolved+'</div><div class="kpi-l">Resolvidos</div></div></div>';
  html+='<div class="sev-filters"><button class="sev-btn'+(revFilter==="all"?" active":"")+'" onclick="setRevFilter(\'all\')">Todos ('+reviewData.length+')</button><button class="sev-btn'+(revFilter==="CRITICO"?" active":"")+'" onclick="setRevFilter(\'CRITICO\')">🔴 Críticos</button><button class="sev-btn'+(revFilter==="ALTO"?" active":"")+'" onclick="setRevFilter(\'ALTO\')">🟠 Altos</button></div>';
  var filtered=revFilter==="all"?reviewData:reviewData.filter(function(d){return d.severity===revFilter});
  filtered.sort(function(a,b){var aR=revDecisions[a.row]?1:0,bR=revDecisions[b.row]?1:0;if(aR!==bR)return aR-bR;return(a.severity==="CRITICO"?0:1)-(b.severity==="CRITICO"?0:1)});
  filtered.forEach(function(e){
    var d=revDecisions[e.row]||"";
    var init=(e.nm&&e.nm!=="Desconhecido")?e.nm.charAt(0).toUpperCase():"?";
    var sevBdg=e.severity==="CRITICO"?'<span class="bdg b-con">🔴 CRÍTICO</span>':'<span class="bdg" style="background:rgba(245,158,11,.12);color:var(--orange)">🟠 ALTO</span>';
    var acBdg=e.acao==="CURTIDO"?'<span class="bdg" style="background:rgba(129,140,248,.12);color:var(--accent2)">👍 Curtido</span> ':'';
    if(e.st.indexOf("ENVIADO")===0)acBdg+='<span class="bdg b-e">📨 Enviado</span> ';
    if(e.st==="PENDENTE_ENVIO")acBdg+='<span class="bdg b-p">⏳ Pendente</span> ';
    acBdg+=bg(e.cl);
    var cmHtml=(e.cm||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    e.negKw.forEach(function(kw){var re=new RegExp("("+kw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");cmHtml=cmHtml.replace(re,"<mark>$1</mark>")});
    cmHtml=cmHtml.replace(/\n/g,"<br>");
    html+='<div class="rev-card sev-'+e.severity+(d?" resolved "+(d==="ok"?"ok-d":"flag-d"):"")+'">';
    html+='<div class="rev-head"><div class="rev-user"><div class="rev-av">'+init+'</div><div><div class="rev-nm">'+e.nm+'</div><div class="rev-meta">'+pB(e.pl)+' · '+(e.dh||"").substring(0,10)+'</div></div></div><div>'+sevBdg+' '+acBdg+'</div></div>';
    html+='<div class="rev-text">'+cmHtml+'</div>';
    html+='<div class="rev-foot"><div>'+e.negKw.map(function(k){return'<span class="rev-kw">'+k+'</span>'}).join("")+' <span class="rev-row">Row #'+e.row+'</span></div>';
    html+='<div><button class="rev-btn ok" onclick="revDecide('+e.row+',\'ok\')"><i class="fa-solid fa-check"></i> OK</button> <button class="rev-btn flag" onclick="revDecide('+e.row+',\'flag\')"><i class="fa-solid fa-trash"></i> Remover</button></div>';
    html+='</div></div>';
  });
  p.innerHTML=html;
}

function renderErrors(){
  var p=document.getElementById("perrors");
  var igErr=errorData.filter(function(e){return(e.pl||"").toUpperCase().indexOf("INSTAGRAM")>=0});
  var fbErr=errorData.filter(function(e){return(e.pl||"").toUpperCase().indexOf("INSTAGRAM")<0});
  var html='<div class="err-alert"><h3><i class="fa-solid fa-bug"></i> Instagram: '+igErr.length+' erros de envio</h3>';
  html+='<p>Todos os comentários do Instagram retornam <code>ERRO 400</code>. Nenhuma resposta/curtida IG foi enviada com sucesso.</p>';
  html+='<p style="margin-top:8px"><strong>Diagnóstico:</strong> O workflow usa <code>POST /{comment_id}/likes</code> (Facebook). Instagram não suporta este endpoint.</p>';
  html+='<ul class="err-fix"><li><strong>Fix 1:</strong> Filtrar Instagram no "Filtrar Pendentes" (✅ já aplicado)</li>';
  html+='<li><strong>Fix 2:</strong> Verificar permissão <code>instagram_manage_comments</code></li>';
  html+='<li><strong>Fix 3:</strong> Para responder IG: usar <code>POST /{comment_id}/replies</code></li></ul></div>';
  if(fbErr.length>0)html+='<div class="err-alert" style="border-color:var(--muted)"><h3 style="color:var(--muted)"><i class="fa-solid fa-info-circle"></i> Facebook: '+fbErr.length+' erros</h3><p>Possível: comentário deletado ou privado.</p></div>';
  html+='<div class="tw" style="margin-top:12px"><table><thead><tr><th>Data</th><th>Plat</th><th>Classif</th><th>Comentário</th><th>Erro</th></tr></thead><tbody>';
  errorData.slice(0,50).forEach(function(e){
    html+='<tr><td class="ts">'+tr((e.dh||"").substring(0,16),16)+'</td><td>'+pB(e.pl)+'</td><td>'+bg(e.cl)+'</td><td class="cm"><div class="cm-t">'+tr(e.cm,80)+'</div></td><td><span class="bdg b-con"><i class="fa-solid fa-xmark" style="margin-right:2px"></i>400</span></td></tr>';
  });
  html+='</tbody></table></div>';p.innerHTML=html;
}

window.setRevFilter=function(f){revFilter=f;renderReview()};
window.revDecide=function(row,action){if(revDecisions[row]===action)delete revDecisions[row];else revDecisions[row]=action;renderReview()};
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});document.querySelectorAll(".pnl").forEach(function(x){x.classList.remove("on")});t.classList.add("on");var map={env:"pe",pend:"pp",all:"pa",review:"preview",errors:"perrors"};document.getElementById(map[t.dataset.t]).classList.add("on")})});
window.flt=function(i){var q=i.value.toLowerCase();i.closest(".pnl").querySelectorAll("tbody tr").forEach(function(r){r.style.display=r.dataset.s.indexOf(q)>=0?"":"none"})};
window._af=new Set();window.pf=function(b,p){if(_af.has(p)){_af.delete(p);b.classList.remove("on")}else{_af.add(p);b.classList.add("on")}b.closest(".pnl").querySelectorAll("tbody tr").forEach(function(r){r.style.display=_af.size===0?"":(_af.has(r.dataset.p)?"":"none")})};
setInterval(function(){if(sessionStorage.getItem("qg")==="1")loadData()},300000);
</script>
